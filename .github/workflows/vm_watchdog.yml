name: VM Watchdog

on:
  workflow_dispatch:
  schedule:
    # - cron: "*/5 * * * *"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Write OCI config
        run: |
          set -e
          mkdir -p ~/.oci
          cat > ~/.oci/config <<'CONFIG'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          CONFIG

          echo "${{ secrets.OCI_API_KEY_PEM }}" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

      - name: Health check
        id: health
        run: |
          set -e
          URL="${{ secrets.HEALTH_URL }}"
          echo "Checking ${URL}"
          if curl -fsS --max-time 10 --retry 3 --retry-delay 5 "${URL}" > /tmp/health.txt; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Soft reset instance if unhealthy
        if: steps.health.outputs.healthy != 'true'
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: True
        run: |
          oci compute instance action \
            --instance-id "${{ secrets.OCI_INSTANCE_OCID }}" \
            --action SOFTRESET \
            --wait-for-state RUNNING \
            --max-wait-seconds 600
