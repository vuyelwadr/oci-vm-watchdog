name: VM Watchdog (OCI Health Check)

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allow manual trigger

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check Health Endpoint
        id: health_check
        run: |
          response=$(curl -sL -o /dev/null -w "%{http_code}" "http://${{ secrets.SSH_HOST }}/api/health?run_mode=live" --max-time 30 || echo "000")
          echo "Health check response: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Health OK!"
            echo "status=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ Health Check Failed! Status: $response"
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.health_check.outputs.status == 'failed'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Attempt 1 - Restart Services via SSH
        if: steps.health_check.outputs.status == 'failed'
        id: service_restart
        run: |
          echo "Attempting service restart via SSH..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl restart binance-trader.service binance-dashboard.service" 2>&1 || {
            echo "SSH connection failed - VM may be frozen"
            echo "ssh_failed=true" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "Service restart command sent. Waiting 45s..."
          sleep 45

      - name: Verify Health After Restart
        if: steps.health_check.outputs.status == 'failed' && steps.service_restart.outputs.ssh_failed != 'true'
        id: health_retry
        run: |
          response=$(curl -sL -o /dev/null -w "%{http_code}" "http://${{ secrets.SSH_HOST }}/api/health?run_mode=live" --max-time 30 || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Recovered after service restart!"
            echo "status=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ Still failing. Status: $response"
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Attempt 2 - OCI VM Action
        if: steps.health_check.outputs.status == 'failed' && (steps.service_restart.outputs.ssh_failed == 'true' || steps.health_retry.outputs.status == 'failed')
        run: |
          echo "SSH restart failed. Checking VM state via OCI..."
          
          # Install OCI CLI
          pip install oci-cli --quiet
          
          # Setup OCI config
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          
          echo "${{ secrets.OCI_API_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config
          
          # Get current VM state
          STATE=$(oci compute instance get \
            --instance-id "${{ secrets.OCI_INSTANCE_OCID }}" \
            --query 'data."lifecycle-state"' \
            --raw-output 2>/dev/null || echo "UNKNOWN")
          echo "Current VM state: $STATE"
          
          case "$STATE" in
            STOPPING|STARTING|TERMINATED|TERMINATING)
              echo "⏳ VM is in $STATE state - cannot take action. Will check again next run."
              ;;
            STOPPED)
              echo "🚀 VM is STOPPED. Starting it..."
              oci compute instance action \
                --instance-id "${{ secrets.OCI_INSTANCE_OCID }}" \
                --action START || echo "START action failed"
              echo "START command sent. VM will boot in 30-40 min."
              ;;
            RUNNING)
              echo "🔄 VM is RUNNING but frozen. Triggering SOFTRESET..."
              oci compute instance action \
                --instance-id "${{ secrets.OCI_INSTANCE_OCID }}" \
                --action SOFTRESET || echo "SOFTRESET action failed"
              echo "SOFTRESET command sent. VM will reboot in 30-40 min."
              ;;
            *)
              echo "⚠️ Unexpected state: $STATE"
              ;;
          esac
          
          echo "✅ Watchdog action complete. Next scheduled check in 15 minutes."
