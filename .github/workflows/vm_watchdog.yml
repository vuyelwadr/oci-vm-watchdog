name: VM Watchdog (Smart Health Check)

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes (safe for boot time)
  workflow_dispatch: # Allow manual trigger

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check Health Endpoint
        id: health_check
        run: |
          response=$(curl -sL -o /dev/null -w "%{http_code}" "http://${{ secrets.SSH_HOST }}/api/health?run_mode=live" --max-time 30)
          if [ "$response" != "200" ]; then
            echo "Health Check Failed! Status: $response"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Health OK! Status: $response"
            echo "status=ok" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Setup SSH (Only on Failure)
        if: steps.health_check.outcome == 'failure'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Attempt 1 - Restart Services
        if: steps.health_check.outcome == 'failure'
        run: |
          echo "Attempting Soft Restart..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo systemctl restart binance-trader.service binance-dashboard.service" || true
          echo "Waiting 45s for services to stabilize..."
          sleep 45

      - name: Verify Health After Restart
        if: steps.health_check.outcome == 'failure'
        id: health_retry
        run: |
          response=$(curl -sL -o /dev/null -w "%{http_code}" "http://${{ secrets.SSH_HOST }}/api/health?run_mode=live" --max-time 30)
          if [ "$response" != "200" ]; then
            echo "Still failing after restart... Status: $response"
            exit 1
          else
            echo "Recovered after restart!"
          fi
        continue-on-error: true

      - name: Attempt 2 - Hard Reboot VM (OCI)
        if: steps.health_check.outcome == 'failure' && steps.health_retry.outcome == 'failure'
        run: |
          echo "Restart failed. Checking VM state before triggering SOFTRESET..."
          
          # Install OCI CLI
          pip install oci-cli --quiet
          
          # Write config (CRITICAL: no leading spaces in INI content!)
          mkdir -p ~/.oci
          cat > ~/.oci/config <<'EOF'
[DEFAULT]
user=${{ secrets.OCI_USER_OCID }}
fingerprint=${{ secrets.OCI_FINGERPRINT }}
tenancy=${{ secrets.OCI_TENANCY_OCID }}
region=${{ secrets.OCI_REGION }}
key_file=/home/runner/.oci/oci_api_key.pem
EOF
          
          echo "${{ secrets.OCI_API_KEY_PEM }}" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
          
          # Check current lifecycle state first
          echo "Checking VM lifecycle state..."
          STATE=$(oci compute instance get \
            --instance-id "${{ secrets.OCI_INSTANCE_OCID }}" \
            --query 'data."lifecycle-state"' \
            --raw-output)
          echo "Current VM state: $STATE"
          
          # If already cycling (STOPPING/STARTING), don't trigger another action
          # E2.micro can take 30-40 minutes to complete a reboot cycle
          if [ "$STATE" = "STOPPING" ] || [ "$STATE" = "STARTING" ]; then
            echo "VM is already in $STATE state - reboot cycle in progress."
            echo "E2.micro can take 30-40 minutes to complete. Exiting without action."
            exit 0
          fi
          
          # Only SOFTRESET if in RUNNING (but frozen) state
          if [ "$STATE" != "RUNNING" ]; then
            echo "VM in unexpected state: $STATE. Not triggering SOFTRESET."
            exit 1
          fi
          
          echo "VM is RUNNING (but frozen). Triggering SOFTRESET..."
          oci compute instance action \
            --instance-id "${{ secrets.OCI_INSTANCE_OCID }}" \
            --action SOFTRESET
          
          echo "SOFTRESET triggered! VM will reboot (may take 30-40 min on E2.micro)."
          echo "Next scheduled run will verify recovery."
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: True

